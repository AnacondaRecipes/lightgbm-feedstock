{% set name = "lightgbm" %}
{% set version = "4.7.0" %}
{% set build_number = 0 %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: f8e20f682c9aabd000bcf4a7ed8aa6f473c1adfecccae34ec24e823d156f4af0

  - url: https://github.com/lightgbm-org/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 2463b653b456cb3c9816dd014105d05917e38432f360f9e9739b5446fac9021d
    folder: tests

build:
  number: {{ build_number + 100 }}  # [gpu_variant == "cuda"]
  number: {{ build_number }}        # [gpu_variant != "cuda"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                # [gpu_variant != "cuda"]
  # LightGBM 4.7.0 requires NCCL for CUDA builds; NCCL is unavailable on Windows.
  skip: true  # [py<310 or (win and gpu_variant == "cuda")]
  # Windows: inline scripts avoid conda-build's IF wrapper corrupting %VAR% in .bat files
  script: "%PYTHON% -m pip install . --no-deps --no-build-isolation -vv -Ccmake.define.USE_CUDA=OFF -Ccmake.define.__BUILD_FOR_PYTHON=ON"  # [win and gpu_variant != "cuda"]
  # Suppress CUDA compiler run_exports (tight pin); use explicit cuda-version
  # pin_compatible(min_pin='x') instead for forward compat within major version.
  ignore_run_exports_from:                        # [gpu_variant == "cuda"]
    - {{ compiler('cuda') }}                      # [gpu_variant == "cuda"]
  missing_dso_whitelist:  # [osx or gpu_variant == "cuda"]
    - '*/libc++.1.dylib'  # [osx]
    - "**/libcuda.so*"    # [gpu_variant == "cuda"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}   # [gpu_variant == "cuda"]
    - {{ stdlib('c') }}
    - cmake >=3.28
    - ninja-base >=1.12.1
  host:
    # This basically forces to pick scipy (and any other suitable packages in the chain, like numpy)
    # that was built with openblas rather than mkl. Openblas typically pairs with llvm-openmp and mkl with intel-openmp on osx-64.
    # By default, mkl variants are picked. By picking the variant that uses openblas rather
    # than mkl, intel-openmp will not be pulled in and so you will not have llvm-openmp / intel-openmp conflict.
    - blas =*=openblas  # [osx and x86_64]
    - scikit-build-core >=0.11.0
    - python
    - pip
    - llvm-openmp                                          # [osx]
    - libgomp          # [linux]
    - vcomp14          # [win and x86_64]
    - cuda-version {{ cuda_compiler_version }}              # [gpu_variant == "cuda"]
    - cuda-cudart-dev                                      # [gpu_variant == "cuda"]
    - nccl {{ nccl }}  # [linux and gpu_variant == "cuda"]
  run:
    - libgomp          # [linux]
    - vcomp14          # [win and x86_64]
    - blas =*=openblas  # [osx and x86_64]
    - python
    - narwhals >=1.15
    - numpy >=1.21.3
    - scipy
    - {{ pin_compatible('cuda-version', min_pin='x') }}    # [gpu_variant == "cuda"]
    - __cuda                                               # [gpu_variant == "cuda"]
  run_constrained:
    - dask >=2.0.0
    - pandas >=1.3.4
    - polars >=1.0.0
    - pyarrow >=16.0.0
    - scikit-learn >=1.0.2

# test_list_to_1d_numpy[...-pd_str]: pandas string dtype not supported by LightGBM
{% set deselected_tests = "((test_list_to_1d_numpy and pd_str) or test_dataset_construction_overwrites_user_provided_metadata_fields)" %}
# CUDA: additionally skip position-in-ranking tests unsupported by the CUDA backend.
{% set cuda_deselected_tests = "(test_dataset_construct_position or test_ranking_with_position_information_with_dataset_constructor or test_set_position_updates_self_position_with_remapped_int32_values or (test_set_field_none_removes_field and position))" %}

test:
  source_files:
    - tests
  imports:
    - lightgbm
  requires:
    - pip
    - matplotlib-base
    - pytest
    - cloudpickle
    - psutil
    - joblib >=1.3.2
    # arrow
    - pyarrow
    - cffi
    # panda
    - pandas
    # scikit-learn
    - scikit-learn
  commands:
    - pip check
    - python -c "import lightgbm; print('LightGBM version:', lightgbm.__version__)"
    - pytest -vv -k "not ({{ deselected_tests }} or {{ cuda_deselected_tests }})"  # [gpu_variant == "cuda"]

about:
  home: https://github.com/lightgbm-org/LightGBM
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: LightGBM is a gradient boosting framework that uses tree based learning algorithms.
  description: |
    A fast, distributed, high performance gradient boosting (GBDT, GBRT, GBM or MART) framework
    based on decision tree algorithms, used for ranking, classification and many other machine learning tasks.
  doc_url: https://lightgbm.readthedocs.io
  dev_url: https://github.com/lightgbm-org/LightGBM

extra:
  recipe-maintainers:
    - synapticarbors
    - aldanor
    - xhochy
