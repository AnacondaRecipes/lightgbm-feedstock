{% set name = "lightgbm" %}
{% set version = "4.6.0" %}
{% set build_number = 1 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: cb1c59720eb569389c0ba74d14f52351b573af489f230032a1c9f314f8bab7fe
    patches:
      - patches/cuda-win-nvcc-compat.patch   # [gpu_variant == "cuda"]
      - patches/cuda13-drop-old-archs.patch  # [gpu_variant == "cuda"]
  - url: https://github.com/microsoft/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 71d2c25855f10e82da8cb8b0c42bdf0da56e5556ff50a93b31c0592b8932eda3
    folder: tests

build:
  number: {{ build_number + 100 }}  # [gpu_variant == "cuda"]
  number: {{ build_number }}        # [gpu_variant != "cuda"]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                # [gpu_variant != "cuda"]
  skip: true  # [py<39]
  # Windows: inline scripts avoid conda-build's IF wrapper corrupting %VAR% in .bat files
  script: "%PYTHON% -m pip install . --no-deps --no-build-isolation -vv -Ccmake.define.USE_CUDA=OFF -Ccmake.define.__BUILD_FOR_PYTHON=ON"  # [win and gpu_variant != "cuda"]
  # CUDA Windows: Ninja required (MSBuild ignores conda env vars for CUDA paths).
  # __BUILD_FOR_PYTHON=ON must be explicit because -Ccmake.args=-GNinja overrides
  # pyproject.toml's cmake.args (which normally provides it).
  script: "set \"PATH=%BUILD_PREFIX%\\Library\\bin;%PATH%\" && set CUDA_HOME=%BUILD_PREFIX%\\Library && set CUDA_PATH=%BUILD_PREFIX%\\Library && set CUDAToolkit_ROOT=%BUILD_PREFIX%\\Library && set CMAKE_CUDA_COMPILER=%BUILD_PREFIX%\\Library\\bin\\nvcc.exe && set CMAKE_MAKE_PROGRAM=%BUILD_PREFIX%\\Library\\bin\\ninja.exe && set \"CMAKE_GENERATOR=\" && set \"CMAKE_GENERATOR_PLATFORM=\" && set \"CMAKE_GENERATOR_TOOLSET=\" && %PYTHON% -m pip install . --no-deps --no-build-isolation -vv -Ccmake.args=-GNinja -Ccmake.define.USE_CUDA=ON -Ccmake.define.__BUILD_FOR_PYTHON=ON -Ccmake.define.CMAKE_CUDA_STANDARD=17 -Ccmake.define.CMAKE_MAKE_PROGRAM=%BUILD_PREFIX%\\Library\\bin\\ninja.exe"  # [win and gpu_variant == "cuda"]
  # Suppress CUDA compiler run_exports (tight pin); use explicit cuda-version
  # pin_compatible(min_pin='x') instead for forward compat within major version.
  ignore_run_exports_from:                        # [gpu_variant == "cuda"]
    - {{ compiler('cuda') }}                      # [gpu_variant == "cuda"]
  missing_dso_whitelist:  # [osx or gpu_variant == "cuda"]
    - '*/libc++.1.dylib'  # [osx]
    - "**/libcuda.so*"    # [gpu_variant == "cuda"]
    - "**/nvcuda.dll"     # [win and gpu_variant == "cuda"]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}   # [gpu_variant == "cuda"]
    - {{ stdlib('c') }}
    - cmake >=3.18
    - ninja-base >=1.12.1
  host:
    # This basically forces to pick scipy (and any other suitable packages in the chain, like numpy)
    # that was built with openblas rather than mkl. Openblas typically pairs with llvm-openmp and mkl with intel-openmp on osx-64.
    # By default, mkl variants are picked. By picking the variant that uses openblas rather
    # than mkl, intel-openmp will not be pulled in and so you will not have llvm-openmp / intel-openmp conflict.
    - blas =*=openblas  # [osx and x86_64]
    - scikit-build-core >=0.10.1
    - python
    - pip
    - llvm-openmp                                          # [osx]
    - cuda-version {{ cuda_compiler_version }}              # [gpu_variant == "cuda"]
    - cuda-cudart-dev                                      # [gpu_variant == "cuda"]
  run:
    - _openmp_mutex    # [linux]
    - blas =*=openblas  # [osx and x86_64]
    - python
    - numpy >=1.17.0
    - scipy
    - {{ pin_compatible('cuda-version', min_pin='x') }}    # [gpu_variant == "cuda"]
    - __cuda                                               # [gpu_variant == "cuda"]
  run_constrained:
    - cffi >=1.15.1
    - dask >=2.0.0
    - pandas >=0.24.0
    - pyarrow >=6.0.1
    - scikit-learn >=0.24.2

test:
  source_files:
    - tests
  imports:
    - lightgbm
  requires:
    - pip
    - matplotlib-base
    - pytest
    - cloudpickle
    - psutil
    - joblib >=1.3.2
    # arrow
    - pyarrow
    - cffi
    # panda
    - pandas
    # scikit-learn
    - scikit-learn
  commands:
    - pip check
    - python -c "import lightgbm; print('LightGBM version:', lightgbm.__version__)"
    # test_list_to_1d_numpy[...-pd_str]: pandas string dtype not supported by LightGBM
    # CUDA: also skip position-in-ranking tests (not supported in CUDA version yet)
    - pytest -vv -k "not ((test_list_to_1d_numpy and pd_str) or test_dataset_construction_overwrites_user_provided_metadata_fields or test_ranking_with_position_information_with_dataset_constructor)"  # [gpu_variant == "cuda"]

about:
  home: https://github.com/Microsoft/LightGBM
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: LightGBM is a gradient boosting framework that uses tree based learning algorithms.
  description: |
    A fast, distributed, high performance gradient boosting (GBDT, GBRT, GBM or MART) framework
    based on decision tree algorithms, used for ranking, classification and many other machine learning tasks.
  doc_url: https://lightgbm.readthedocs.io
  dev_url: https://github.com/Microsoft/LightGBM

extra:
  recipe-maintainers:
    - synapticarbors
    - aldanor
    - xhochy
